name: Validate, package, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Lua 5.1 and addon regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check.py

  package:
    name: Build installable ZIP
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Package and verify release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package.py --tag "$RELEASE_TAG"
          else
            python tools/package.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WarbandVaultForever
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WarbandVaultForever
          path: dist
      - name: Publish tested tag with changelog and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(python -c 'import sys; sys.path.insert(0,"tools"); from package import version; print("v"+version())')"
          fi
          python tools/release_notes.py --tag "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; leaving published assets unchanged.'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG"
            tag_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo 'Refusing to publish a tag that points to another commit.'
              exit 1
            fi
          else
            tag_object="$(gh api "repos/$GH_REPO/git/tags" -X POST \
              -f tag="$RELEASE_TAG" -f message="Warband Vault Forever $RELEASE_TAG" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
            gh api "repos/$GH_REPO/git/refs" -X POST \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Warband Vault Forever $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md "${flags[@]}"
